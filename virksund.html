  <script>
    (function () {
      var thumbs = Array.prototype.slice.call(document.querySelectorAll('.gallery button'));
      var viewer = document.querySelector('.viewer');
      var big = viewer.querySelector('img');
      var count = viewer.querySelector('.viewer-count');
      var current = 0;

      function show(i) {
        current = (i + thumbs.length) % thumbs.length;
        var img = thumbs[current].querySelector('img');
        big.src = img.src;
        big.alt = img.alt;
        count.textContent = (current + 1) + ' / ' + thumbs.length;
      }

      thumbs.forEach(function (btn, i) {
        btn.addEventListener('click', function () {
          show(i);
          viewer.showModal();
        });
      });

      viewer.querySelector('.viewer-close').addEventListener('click', function () { viewer.close(); });
      viewer.querySelector('.viewer-prev').addEventListener('click', function () { show(current - 1); });
      viewer.querySelector('.viewer-next').addEventListener('click', function () { show(current + 1); });

      // click on the dark area around the photo closes it
      viewer.addEventListener('click', function (e) {
        if (e.target === viewer) viewer.close();
      });

      viewer.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
      });

      // return focus to the photo you came from
      viewer.addEventListener('close', function () { thumbs[current].focus(); });
    })();
  </script>
