<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familien Jervad</title>
  <meta name="description" content="Familien Jervads hjemmeside – have og gospel. Siden er under opbygning.">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="season.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <ellipse id="petal" cx="0" cy="-15" rx="6" ry="13"/>
      <g id="daisy">
        <g fill="#fffaf0" stroke="#e9dcc4" stroke-width="1">
          <use href="#petal"/>
          <use href="#petal" transform="rotate(40)"/>
          <use href="#petal" transform="rotate(80)"/>
          <use href="#petal" transform="rotate(120)"/>
          <use href="#petal" transform="rotate(160)"/>
          <use href="#petal" transform="rotate(200)"/>
          <use href="#petal" transform="rotate(240)"/>
          <use href="#petal" transform="rotate(280)"/>
          <use href="#petal" transform="rotate(320)"/>
        </g>
        <circle r="8" fill="#e8a33d"/>
      </g>
      <g id="bloom">
        <g fill="currentColor">
          <circle cx="0" cy="-11" r="10"/>
          <circle cx="10.5" cy="-3.4" r="10"/>
          <circle cx="6.5" cy="9" r="10"/>
          <circle cx="-6.5" cy="9" r="10"/>
          <circle cx="-10.5" cy="-3.4" r="10"/>
        </g>
        <circle r="6" fill="#fff4d6"/>
      </g>
      <path id="tulip" d="M-14 -24 L-7 -14 L0 -28 L7 -14 L14 -24 C16 -6 10 6 0 6 C-10 6 -16 -6 -14 -24 Z"/>
      <path id="leaf" d="M0 0 C10 -6 22 -6 30 -16 C20 -2 10 4 0 0 Z"/>
      <g id="note">
        <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-20)"/>
        <rect x="5" y="-34" width="2.4" height="34"/>
        <path d="M7.4 -34 C14 -28 20 -24 16 -12 C16 -20 12 -24 7.4 -25 Z"/>
      </g>
      <g id="notes2">
        <ellipse cx="0" cy="0" rx="7" ry="5" transform="rotate(-20)"/>
        <ellipse cx="24" cy="-6" rx="7" ry="5" transform="rotate(-20 24 -6)"/>
        <rect x="5" y="-34" width="2.4" height="34"/>
        <rect x="29" y="-40" width="2.4" height="34"/>
        <path d="M5 -34 L31.4 -40 L31.4 -33 L5 -27 Z"/>
      </g>

      <!-- autumn shapes -->
      <path id="mapleleaf" d="M0 -14 L3 -8 L7 -10 L6 -4 L12 -5 L9 0 L12 2 L4 3 L5 7 L1 5 L0.8 13 L-0.8 13 L-1 5 L-5 7 L-4 3 L-12 2 L-9 0 L-12 -5 L-6 -4 L-7 -10 L-3 -8 Z"/>
      <g id="ovalleaf">
        <path d="M0 -14 C7 -8 8 2 0 9 C-8 2 -7 -8 0 -14 Z"/>
        <path d="M0 -11 L0 15" stroke="rgba(80,35,10,.5)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      </g>
      <g id="bigmaple" transform="scale(1.6)"><use href="#mapleleaf"/></g>
      <g id="bigoval" transform="scale(1.5)"><use href="#ovalleaf"/></g>
      <g id="aster">
        <g fill="currentColor">
          <ellipse cx="0" cy="-12" rx="3.6" ry="10"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(30)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(60)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(90)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(120)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(150)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(180)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(210)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(240)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(270)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(300)"/>
          <ellipse cx="0" cy="-12" rx="3.6" ry="10" transform="rotate(330)"/>
        </g>
        <circle r="6" fill="#f2c14e"/>
      </g>
      <g id="pumpkin">
        <path d="M-1 -14 C-1 -20 1 -24 5 -26" stroke="#6b6430" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <g fill="currentColor" stroke="rgba(90,40,10,.22)" stroke-width="1.5">
          <ellipse cx="-12" cy="0" rx="12" ry="15"/>
          <ellipse cx="12" cy="0" rx="12" ry="15"/>
          <ellipse cx="0" cy="0" rx="11" ry="16"/>
        </g>
      </g>
      <g id="mushroom">
        <rect x="-4.5" y="-2" width="9" height="16" rx="4" fill="#f3e6cf"/>
        <path d="M-16 0 C-16 -17 16 -17 16 0 Z" fill="#c8412f"/>
        <circle cx="-7" cy="-6" r="2.2" fill="#fff6e8"/>
        <circle cx="3" cy="-10" r="2.6" fill="#fff6e8"/>
        <circle cx="9" cy="-4" r="1.8" fill="#fff6e8"/>
      </g>
    </defs>
  </svg>

  <header class="top">
    <a class="logo" href="./" aria-label="jervad.dk – forside">
      <img class="logo-flower" src="favicon.svg" alt="">
      <span class="logo-text">jervad<span class="logo-tld">.dk</span></span>
    </a>
    <nav class="nav" aria-label="Hovedmenu">
      <a href="om.html">Om os</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Velkommen hos</p>
      <h1><span class="h1-lead">Familien</span> Jervad</h1>
      <p class="lede">Siden er under opbygning. Kig forbi igen snart.</p>
    </section>

    <figure class="scene" aria-hidden="true">
      <svg class="hills" viewBox="0 0 900 380" preserveAspectRatio="none">
        <path class="hill-back" d="M0 300 C150 250 300 270 450 290 C600 310 750 250 900 270 L900 380 L0 380 Z"/>
        <path class="hill-front" d="M0 330 C200 300 380 320 520 330 C680 342 800 310 900 320 L900 380 L0 380 Z"/>
      </svg>
      <svg class="garden" viewBox="0 0 900 380">
       <g class="season season-spring">
        <!-- sun -->
        <circle cx="720" cy="110" r="64" fill="#f7d58b" opacity=".55"/>
        <circle cx="720" cy="110" r="42" fill="#f4c46a" opacity=".7"/>

        <!-- floating notes -->
        <g class="notes" fill="#3b5d4a">
          <use href="#note" class="n n1" x="210" y="120"/>
          <use href="#notes2" class="n n2" x="430" y="80"/>
          <use href="#note" class="n n3" x="600" y="150"/>
          <g transform="translate(120 200) scale(.8)"><use href="#note" class="n n4"/></g>
          <g transform="translate(800 210) scale(.7)"><use href="#notes2" class="n n5"/></g>
        </g>


        <!-- stems -->
        <g stroke="#4f7a52" stroke-width="3.5" fill="none" stroke-linecap="round">
          <path d="M90 340 C92 300 86 270 92 238"/>
          <path d="M170 345 C168 310 176 280 172 252"/>
          <path d="M260 345 C262 300 254 260 262 214"/>
          <path d="M350 350 C346 316 354 290 350 266"/>
          <path d="M560 350 C562 312 556 286 562 250"/>
          <path d="M640 348 C636 300 646 262 640 222"/>
          <path d="M730 352 C732 318 726 292 732 268"/>
          <path d="M820 346 C818 310 826 276 820 240"/>
        </g>

        <!-- leaves -->
        <g fill="#5d8d5c">
          <use href="#leaf" x="92" y="300"/>
          <use href="#leaf" transform="translate(260 300) scale(-1 1)"/>
          <use href="#leaf" x="350" y="320"/>
          <use href="#leaf" transform="translate(562 310) scale(-1 1)"/>
          <use href="#leaf" x="640" y="296"/>
          <use href="#leaf" transform="translate(820 306) scale(-1 1)"/>
        </g>

        <!-- flowers -->
        <g class="sway s1"><use href="#daisy" x="92" y="232"/></g>
        <g class="sway s2" style="color:#d9667a"><use href="#bloom" x="172" y="246"/></g>
        <g class="sway s3" fill="#e2574c"><use href="#tulip" x="262" y="214"/></g>
        <g class="sway s1" style="color:#9a7cc4"><use href="#bloom" x="350" y="260"/></g>
        <g class="sway s2"><use href="#daisy" x="562" y="244"/></g>
        <g class="sway s3" fill="#f0a14a"><use href="#tulip" x="640" y="222"/></g>
        <g class="sway s1" style="color:#e98aa0"><use href="#bloom" x="732" y="262"/></g>
        <g class="sway s2"><use href="#daisy" x="820" y="234"/></g>

        <!-- grass tufts -->
        <g stroke="#4f7a52" stroke-width="2" stroke-linecap="round" fill="none">
          <path d="M40 360 l-4 -14 M44 360 l2 -16 M48 360 l6 -12"/>
          <path d="M440 362 l-4 -14 M444 362 l2 -16 M448 362 l6 -12"/>
          <path d="M870 362 l-4 -14 M874 362 l2 -16 M878 362 l6 -12"/>
        </g>
       </g>

       <g class="season season-autumn">
        <!-- low autumn sun -->
        <circle cx="720" cy="135" r="64" fill="#f5b26b" opacity=".45"/>
        <circle cx="720" cy="135" r="42" fill="#ef9a4a" opacity=".65"/>

        <!-- floating notes -->
        <g class="notes" fill="#5a4636">
          <use href="#note" class="n n1" x="210" y="120"/>
          <use href="#notes2" class="n n2" x="430" y="80"/>
          <g transform="translate(800 210) scale(.7)"><use href="#note" class="n n5"/></g>
        </g>

        <!-- stems -->
        <g stroke="#6f7a3c" stroke-width="3.5" fill="none" stroke-linecap="round">
          <path d="M90 340 C92 300 86 270 92 238"/>
          <path d="M170 345 C168 310 176 280 172 252"/>
          <path d="M260 345 C262 300 254 260 262 214"/>
          <path d="M350 350 C346 316 354 290 350 266"/>
          <path d="M600 350 C602 312 596 286 602 250"/>
          <path d="M660 348 C656 300 666 262 660 222"/>
          <path d="M760 352 C762 318 756 292 762 268"/>
          <path d="M840 346 C838 310 846 276 840 240"/>
        </g>

        <!-- leaves on stems -->
        <g fill="#8a8a3e">
          <use href="#leaf" x="92" y="300"/>
          <use href="#leaf" transform="translate(260 300) scale(-1 1)"/>
          <use href="#leaf" x="350" y="320"/>
          <use href="#leaf" transform="translate(602 310) scale(-1 1)"/>
          <use href="#leaf" x="660" y="296"/>
          <use href="#leaf" transform="translate(840 306) scale(-1 1)"/>
        </g>

        <!-- asters and chrysanthemums -->
        <g class="sway s1" style="color:#8e6bbf"><use href="#aster" x="92" y="232"/></g>
        <g class="sway s2" style="color:#c8642f"><use href="#bloom" x="172" y="246"/></g>
        <g class="sway s3" style="color:#b0548a"><use href="#aster" x="262" y="210"/></g>
        <g class="sway s1" style="color:#d9a531"><use href="#bloom" x="350" y="260"/></g>
        <g class="sway s2" style="color:#7a62b8"><use href="#aster" x="602" y="244"/></g>
        <g class="sway s3" style="color:#a8455a"><use href="#bloom" x="660" y="218"/></g>
        <g class="sway s1" style="color:#d9a531"><use href="#bloom" x="762" y="262"/></g>
        <g class="sway s2" style="color:#9a6fc6"><use href="#aster" x="840" y="234"/></g>

        <!-- pumpkins and mushrooms -->
        <g style="color:#e07b2f"><use href="#pumpkin" x="460" y="322"/></g>
        <g style="color:#eb9a3c"><use href="#pumpkin" transform="translate(512 338) scale(.7)"/></g>
        <use href="#mushroom" x="300" y="318"/>
        <use href="#mushroom" transform="translate(322 326) scale(.65)"/>
        <use href="#mushroom" transform="translate(712 322) scale(.8)"/>

        <!-- leaves on the ground -->
        <g>
          <use href="#mapleleaf" fill="#d9622b" transform="translate(40 332) rotate(-30)"/>
          <use href="#ovalleaf"  fill="#e3a82b" transform="translate(140 336) rotate(70)"/>
          <use href="#mapleleaf" fill="#c43d2f" transform="translate(210 330) rotate(20) scale(.8)"/>
          <use href="#ovalleaf"  fill="#a8552b" transform="translate(400 334) rotate(-60)"/>
          <use href="#mapleleaf" fill="#e3a82b" transform="translate(548 332) rotate(40) scale(.85)"/>
          <use href="#ovalleaf"  fill="#d9622b" transform="translate(620 336) rotate(100)"/>
          <use href="#mapleleaf" fill="#a8552b" transform="translate(800 334) rotate(-15) scale(.75)"/>
          <use href="#ovalleaf"  fill="#c43d2f" transform="translate(872 330) rotate(50)"/>
        </g>

        <!-- falling leaves -->
        <g>
          <g transform="translate(90 20)"><g class="fall f1" fill="#d9622b"><use href="#bigmaple"/></g></g>
          <g transform="translate(380 10)"><g class="fall f3" fill="#c43d2f"><use href="#bigmaple"/></g></g>
          <g transform="translate(520 30)"><g class="fall f4" fill="#d9622b"><use href="#bigoval"/></g></g>
          <g transform="translate(770 45)"><g class="fall f6" fill="#a8552b"><use href="#bigoval"/></g></g>
        </g>
       </g>
      </svg>
    </figure>

    <section class="cards">
      <article class="card card-garden">
        <svg class="icon" viewBox="-30 -36 60 60" aria-hidden="true">
          <use class="season season-spring" href="#daisy"/>
          <g class="season season-autumn" fill="#d9622b" transform="translate(0 -6) scale(1.9)"><use href="#mapleleaf"/></g>
        </svg>
        <h2>Haven</h2>
        <p>Billeder fra haven kommer her.</p>
      </article>
      <article class="card card-gospel">
        <svg class="icon" viewBox="-12 -46 56 56" aria-hidden="true" fill="#f6f1e7"><use href="#notes2"/></svg>
        <h2>Gospel</h2>
        <p>Sang og musik kommer her.</p>
      </article>
      <a class="card card-photo" href="virksund.html">
        <img class="card-img" src="billeder/virksund-2008/img_9069.jpg" alt="">
        <div class="card-body">
          <h2>Virksund</h2>
          <p>Billeder fra Virksund og omegn, juni 2008.</p>
          <span class="card-more">Se billederne <span aria-hidden="true">→</span></span>
        </div>
      </a>
    </section>
  </main>

  <footer class="foot">
    <p>© 2026 jervad.dk</p>
  </footer>
</body>
</html>
